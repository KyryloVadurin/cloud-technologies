# Тут будуть site_name та site_description (див. нижче для кожної дисципліни)

theme:
  name: material
  language: uk
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключити на темну тему
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключити на світлу тему
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

font:
  text: Roboto
  code: JetBrains Mono

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

hooks:
  - hooks/gfm_fixer.py

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: 'Copyright &copy; 2026 Kyrylo Vadurin &bull; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

site_name: Сучасні хмарні технології
site_description: Навчальний портал з дисципліни "Сучасні хмарні технології"

nav:
  - "Робоча програма": index.md
  
  - Лекції:
      - "Тема 1. Парадигма хмарних обчислень": lk/lk1.md
      - "Тема 2. Технології віртуалізації": lk/lk2.md
      - "Тема 3. Хмарні мережі та системи збереження": lk/lk3.md
      - "Тема 4. Асинхронні комунікації та черги": lk/lk4.md
      - "Тема 5. Безсерверна архітектура (Serverless)": lk/lk5.md
      - "Тема 6. Інфраструктура як код (IaC)": lk/lk6.md
      - "Тема 7. Безпека (IAM) та хмарний моніторинг": lk/lk7.md

  - Лабораторні роботи:
      - "ЛБ 1. Програмне керування IaaS (AWS EC2)": lb/lb1.md
      - "ЛБ 2. Віртуальна мережева інфраструктура (VPC)": lb/lb2.md
      - "ЛБ 3. Масштабоване об'єктне сховище (AWS S3)": lb/lb3.md
      - "ЛБ 4. Хмарні NoSQL бази даних (AWS DynamoDB)": lb/lb4.md
      - "ЛБ 5. Асинхронна черга обробки подій (AWS SQS)": lb/lb5.md
      - "ЛБ 6. Безсерверні мікросервіси (AWS Lambda)": lb/lb6.md
      - "ЛБ 7. Автоматизоване розгортання IaC (Terraform)": lb/lb7.md
      - "ЛБ 8. Налаштування безпеки та моніторингу (CloudWatch)": lb/lb8.md
      - "ЛБ 9. Еластична інфраструктура (ALB, ASG)": lb/lb9.md

  - "Самостійна робота": sr/index.md
  - "Перелік тестових завдань": sr/quest.md
