      - "Тема 1. Парадигма хмарних обчислень: генезис розподілених систем, сервісні моделі та інфраструктурне розгортання": lk/lk1.md
      - "Тема 2. Технології системної віртуалізації: апаратна реалізація, паравіртуалізація, механізми ядра та конвергентні системи зберігання даних": lk/lk2.md
      - "Тема 3. Програмно-конфігуровані хмарні мережі та розподілені системи збереження даних": lk/lk3.md
      - "Тема 4. Асинхронні комунікації, черги повідомлень та подійні брокери": lk/lk4.md
      - "Тема 5. Безсерверна архітектура та мікросервіси в розподілених комп'ютерних системах": lk/lk5.md
      - "Тема 6. Концепція «Інфраструктура як код» та автоматизація розгортання": lk/lk6.md
      - "Тема 7. Безпека, хмарний моніторинг, відмовостійкість та аналітика даних": lk/lk7.md

